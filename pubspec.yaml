name: utrack
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.20.2
  http: ^1.1.0
  google_sign_in: ^6.2.1
  image_picker: ^1.0.0
  firebase_storage: ^12.4.0
#  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_text_recognition: ^0.13.1
  cloudinary_public: ^0.21.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  url_launcher: ^6.1.7

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2


  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6


dev_dependencies:
  flutter_test:
    sdk: flutter



  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/logos/
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

